{{- if and .Values.ingress.enabled .Values.ingress.selfSignedTLS.enabled .Values.ingress.tls }}
{{- range .Values.ingress.tls }}
{{- $secretName := .secretName }}
{{- $existing := lookup "v1" "Secret" $.Release.Namespace $secretName }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "http-echo.labels" $ | nindent 4 }}
type: kubernetes.io/tls
data:
  {{- if $existing }}
  tls.crt: {{ index $existing.data "tls.crt" }}
  tls.key: {{ index $existing.data "tls.key" }}
  {{- else }}
  {{- $cert := genSelfSignedCert (first .hosts) nil .hosts (int $.Values.ingress.selfSignedTLS.validityDays) }}
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
  {{- end }}
{{- end }}
{{- end }}
