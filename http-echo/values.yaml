# Default values for http-echo.

replicaCount: 2

image:
  repository: ealen/echo-server
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 5678

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # For real certificates (cert-manager), set selfSignedTLS.enabled=false and add e.g.:
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: http-echo.k8s-server.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: http-echo-tls
      hosts:
        - http-echo.k8s-server.local
  # Generates a self-signed certificate (local/testing). Disable when using cert-manager
  # or a pre-created secret.
  selfSignedTLS:
    enabled: true
    validityDays: 365

# Small, schedulable defaults; tune after observing real usage.
resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}
